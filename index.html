<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="E-Prayog — An interactive virtual science laboratory for Karnataka PUC students featuring immersive 2D simulations and AI-powered tutoring." />
    <meta name="theme-color" content="#04050f" />
    <title>E-Prayog | ಇ-ಪ್ರಯೋಗ — Virtual Science Lab for Karnataka PUC</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
      /* ── Design tokens ── */
      :root {
        --bg-base:        #04050f;
        --text-color:     #f1f5f9;
        --glass-bg:       rgba(10, 10, 28, 0.55);
        --glass-border:   rgba(139, 92, 246, 0.18);
        --nav-bg:         rgba(4, 5, 15, 0.75);
        --accent-glow:    rgba(139, 92, 246, 0.45);

        /* Orb colours */
        --orb-violet:  rgba(109, 40, 217, 0.55);
        --orb-cyan:    rgba(6,  182, 212, 0.40);
        --orb-rose:    rgba(236, 72, 153, 0.35);
        --orb-indigo:  rgba(79,  70, 229, 0.40);
        --orb-emerald: rgba(16, 185, 129, 0.28);
        --orb-sky:     rgba(14, 165, 233, 0.32);
      }
      .dark {
        /* keep same in dark — our palette IS dark-first */
        --bg-base:      #04050f;
        --text-color:   #f1f5f9;
        --glass-bg:     rgba(10, 10, 28, 0.55);
        --glass-border: rgba(139, 92, 246, 0.18);
        --nav-bg:       rgba(4, 5, 15, 0.75);
        --accent-glow:  rgba(139, 92, 246, 0.45);
      }

      /* ── Reset ── */
      * { box-sizing: border-box; }
      ::selection { background-color: rgba(139,92,246,0.4); color: #fff; }

      /* ── Keyframes ── */
      @keyframes orb-drift-1 {
        0%,100% { transform: translate(0%,   0%)   scale(1);    }
        33%     { transform: translate(6%,   -8%)  scale(1.08); }
        66%     { transform: translate(-5%,  5%)   scale(0.95); }
      }
      @keyframes orb-drift-2 {
        0%,100% { transform: translate(0%,   0%)   scale(1);    }
        33%     { transform: translate(-7%,  6%)   scale(1.06); }
        66%     { transform: translate(4%,  -7%)   scale(0.97); }
      }
      @keyframes orb-drift-3 {
        0%,100% { transform: translate(0%,   0%)   scale(1);    }
        50%     { transform: translate(5%,   8%)   scale(1.1);  }
      }
      @keyframes orb-drift-4 {
        0%,100% { transform: translate(0%,   0%)   scale(1);    }
        40%     { transform: translate(-6%,  -5%)  scale(1.05); }
        80%     { transform: translate(3%,   6%)   scale(0.96); }
      }
      @keyframes orb-drift-5 {
        0%,100% { transform: translate(0%,   0%)   scale(1);    }
        50%     { transform: translate(-4%,  7%)   scale(1.07); }
      }
      @keyframes grid-fade {
        0%,100% { opacity: 0.025; }
        50%     { opacity: 0.045; }
      }

      /* ── Body: deep space base ── */
      body {
        background-color: var(--bg-base);
        color: var(--text-color);
        position: relative;
        overflow-x: hidden;
        min-height: 100vh;
      }

      /* ── Fixed mesh layer (behind everything) ── */
      body::before {
        content: '';
        position: fixed;
        inset: -20%;
        width: 140%; height: 140%;
        z-index: 0;
        pointer-events: none;

        /* 6-orb mesh gradient */
        background:
          /* top-left  — deep violet */
          radial-gradient(ellipse 70% 60% at 10% 5%,  var(--orb-violet)  0%, transparent 65%),
          /* top-right — cyan */
          radial-gradient(ellipse 55% 55% at 88% 8%,  var(--orb-cyan)    0%, transparent 60%),
          /* center    — indigo core */
          radial-gradient(ellipse 50% 50% at 50% 40%, var(--orb-indigo)  0%, transparent 65%),
          /* bottom-left  — emerald */
          radial-gradient(ellipse 60% 55% at 5%  90%, var(--orb-emerald) 0%, transparent 60%),
          /* bottom-right — rose */
          radial-gradient(ellipse 65% 60% at 92% 92%, var(--orb-rose)    0%, transparent 65%),
          /* mid-right    — sky */
          radial-gradient(ellipse 45% 50% at 80% 50%, var(--orb-sky)     0%, transparent 60%);

        /* Drift all orbs slowly */
        animation: orb-drift-1 18s ease-in-out infinite;
      }

      /* ── Animated orb overlay (extra depth) ── */
      body::after {
        content: '';
        position: fixed;
        inset: -20%;
        width: 140%; height: 140%;
        z-index: 0;
        pointer-events: none;

        background:
          radial-gradient(ellipse 40% 45% at 70% 20%, rgba(167, 139, 250, 0.22) 0%, transparent 60%),
          radial-gradient(ellipse 35% 40% at 25% 65%, rgba(34, 211, 238, 0.18)  0%, transparent 55%),
          radial-gradient(ellipse 30% 35% at 55% 80%, rgba(251, 113, 133, 0.18) 0%, transparent 55%);

        animation: orb-drift-2 22s ease-in-out infinite;
      }

      /* ── Subtle dot-grid overlay ── */
      #root::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image: radial-gradient(circle, rgba(148,163,184,0.18) 1px, transparent 1px);
        background-size: 36px 36px;
        animation: grid-fade 8s ease-in-out infinite;
      }

      /* Make sure app content sits above the mesh layers */
      #root > * { position: relative; z-index: 1; }

      /* ── Glass components (updated to match new palette) ── */
      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        box-shadow:
          inset 0 0 0 1px rgba(255,255,255,0.04),
          0 8px 40px rgba(0,0,0,0.45);
      }
      .glass-nav {
        background: var(--nav-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-bottom: 1px solid rgba(139,92,246,0.14);
        box-shadow: 0 4px 30px rgba(0,0,0,0.3);
      }

      /* ── Utility helpers ── */
      .text-glow    { text-shadow: 0 0 20px var(--accent-glow); }
      .hover-lift   { transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
      .hover-lift:hover { transform: translateY(-8px); }
      .preserve-3d  { transform-style: preserve-3d; }

      /* ── Scrollbar ── */
      ::-webkit-scrollbar       { width: 6px; }
      ::-webkit-scrollbar-track { background: rgba(4,5,15,0.8); }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #6d28d9, #0ea5e9);
        border-radius: 6px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #7c3aed, #38bdf8);
      }

      /* ══════════════════════════════════════════════════
         E-Prayoga Navbar Orbital Logo Animations
         ══════════════════════════════════════════════════ */

      /* Outer ring — clockwise 6s */
      @keyframes ep-outer-rotate {
        from { transform: rotate(0deg);   }
        to   { transform: rotate(360deg); }
      }
      /* Inner ring — counter-clockwise 4s */
      @keyframes ep-inner-rotate {
        from { transform: rotate(0deg);    }
        to   { transform: rotate(-360deg); }
      }
      /* E glow pulse */
      @keyframes ep-glow-pulse {
        0%,100% { opacity: 0.45; }
        50%      { opacity: 0.85; }
      }
      /* E letter breathe */
      @keyframes ep-e-breathe {
        0%,100% { transform: scale(1.0);  }
        50%      { transform: scale(1.04); }
      }
      /* Spark shimmer */
      @keyframes ep-spark {
        0%,100% { opacity: 0.15; }
        50%      { opacity: 0.65; }
      }

      .ep-outer-ring {
        animation: ep-outer-rotate 6s linear infinite;
        will-change: transform;
        transform-origin: 40px 40px;
      }
      .ep-inner-ring {
        animation: ep-inner-rotate 4s linear infinite;
        will-change: transform;
        transform-origin: 40px 40px;
      }
      .ep-eglow {
        animation: ep-glow-pulse 4s ease-in-out infinite;
        will-change: opacity;
      }
      .ep-eletter {
        animation: ep-e-breathe 4s ease-in-out infinite;
        transform-origin: 40px 40px;
      }
      .ep-spark { animation: ep-spark ease-in-out infinite; }
      .ep-s1 { animation-duration: 3.1s; animation-delay: 0s;   }
      .ep-s2 { animation-duration: 4.4s; animation-delay: 0.7s; }
      .ep-s3 { animation-duration: 2.9s; animation-delay: 1.5s; }
      .ep-s4 { animation-duration: 3.8s; animation-delay: 0.4s; }

      /* Hover: accelerate rings + glow */
      .ep-logo-link:hover .ep-outer-ring { animation-duration: 1.8s; }
      .ep-logo-link:hover .ep-inner-ring { animation-duration: 1.2s; }
      .ep-logo-link:hover .ep-eglow      { opacity: 1 !important; }

    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
