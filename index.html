<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="E-Prayog — An interactive virtual science laboratory for Karnataka PUC students featuring immersive 2D simulations and AI-powered tutoring." />
  <meta name="theme-color" content="#070A0F" />
  <title>E-Prayog | ಇ-ಪ್ರಯೋಗ — Virtual Science Lab for Karnataka PUC</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    /* ══════════════════════════════════════════
       E-Prayog — Obsidian Lab Design System v3.0
       Palette: Deep Obsidian + Lab Cyan + Tactical Amber
       "Precision instrumentation meets luxury interface."
       ══════════════════════════════════════════ */

    /* ── Google Fonts: Sora + Plus Jakarta Sans ── */
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

    /* ── Design Tokens ── */
    :root {
      /* Backgrounds — layered obsidian depth */
      --bg-canvas:       #070A0F;
      --bg-surface:      #0D1117;
      --bg-card:         #121824;
      --bg-floating:     #1A2233;
      --bg-base:         #070A0F;

      /* Primary Accent: Lab Cyan */
      --accent-primary:  #06B6D4;
      --accent-bright:   #22D3EE;
      --accent-muted:    #0891B2;
      --accent-glow:     rgba(6, 182, 212, 0.25);

      /* Secondary Accent: Tactical Amber (rare, intentional) */
      --accent-second:   #F59E0B;
      --accent-second-light: #FBBF24;

      /* Text */
      --text-primary:    #E2E8F0;
      --text-secondary:  #94A3B8;
      --text-muted:      #475569;
      --text-color:      #E2E8F0;

      /* Borders — hairline precision */
      --border-subtle:   rgba(226, 232, 240, 0.06);
      --border-default:  rgba(226, 232, 240, 0.10);
      --border-strong:   rgba(6, 182, 212, 0.25);
      --glass-border:    rgba(226, 232, 240, 0.08);
      --glass-bg:        rgba(18, 24, 36, 0.70);
      --nav-bg:          rgba(7, 10, 15, 0.80);

      /* Subject accents — preserved */
      --subject-physics:     #5BA3D4;
      --subject-chemistry:   #F5A623;
      --subject-biology:     #5BB887;
      --subject-math:        #A78BFA;
      --subject-cs:          #60C4D4;

      /* Typography */
      --font-display:    'Sora', system-ui, sans-serif;
      --font-body:       'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono:       'JetBrains Mono', monospace;

      /* Spacing scale (4px base) */
      --space-1:   4px;  --space-2:   8px;  --space-3:  12px;
      --space-4:  16px;  --space-5:  24px;  --space-6:  32px;
      --space-7:  48px;  --space-8:  64px;  --space-9:  96px;
      --space-10: 128px;

      /* Border radius */
      --radius-sm:    4px;
      --radius-md:    8px;
      --radius-lg:   16px;
      --radius-xl:   24px;
      --radius-2xl:  32px;
      --radius-full: 999px;

      /* Easing tokens — slow, physical, purposeful */
      --ease-out-expo:  cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out:    cubic-bezier(0.4, 0, 0.2, 1);
      --ease-spring:    cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .dark {
      --bg-base:      #070A0F;
      --text-color:   #E2E8F0;
      --glass-bg:     rgba(18, 24, 36, 0.70);
      --glass-border: rgba(226, 232, 240, 0.08);
      --nav-bg:       rgba(7, 10, 15, 0.80);
      --accent-glow:  rgba(6, 182, 212, 0.25);
    }

    /* ── Reset ── */
    * {
      box-sizing: border-box;
    }

    ::selection {
      background-color: rgba(6, 182, 212, 0.30);
      color: #E2E8F0;
    }

    /* ── Keyframes ── */

    /* Hero text entry — staggered rise-up */
    @keyframes riseUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Subtle grain shimmer */
    @keyframes grain-shift {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-2%, -2%); }
      30% { transform: translate(1%, -1%); }
      50% { transform: translate(-1%, 2%); }
      70% { transform: translate(2%, 1%); }
      90% { transform: translate(-2%, 1%); }
    }

    /* Dot grid subtle pulse */
    @keyframes grid-fade {
      0%, 100% { opacity: 0.03; }
      50%       { opacity: 0.06; }
    }

    /* Scroll reveal */
    @keyframes revealFadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Hero entry animations — slow, deliberate */
    .hero-badge  { animation: riseUp 0.7s var(--ease-out-expo) 0.05s both; }
    .hero-line-1 { animation: riseUp 0.7s var(--ease-out-expo) 0.18s both; }
    .hero-line-2 { animation: riseUp 0.7s var(--ease-out-expo) 0.30s both; }
    .hero-sub    { animation: riseUp 0.7s var(--ease-out-expo) 0.44s both; }
    .hero-ctas   { animation: riseUp 0.7s var(--ease-out-expo) 0.58s both; }
    .hero-stats  { animation: riseUp 0.7s var(--ease-out-expo) 0.72s both; }

    /* Scroll reveal utility */
    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.65s var(--ease-out-expo),
                  transform 0.65s var(--ease-out-expo);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    /* Card stagger delays */
    .stagger-1 { transition-delay:   0ms; }
    .stagger-2 { transition-delay:  80ms; }
    .stagger-3 { transition-delay: 160ms; }
    .stagger-4 { transition-delay: 240ms; }
    .stagger-5 { transition-delay: 320ms; }

    /* ── Body: deep obsidian canvas ── */
    body {
      background: #070A0F !important;
      color: var(--text-primary);
      font-family: var(--font-body);
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
    }

    #root,
    #root > div {
      background-color: transparent !important;
      background-image: none !important;
    }

    /* ── Noise texture overlay — subtle grain for depth ── */
    body::before {
      content: '';
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      animation: grain-shift 8s steps(10) infinite;
    }

    /* ── Fine dot grid overlay — structured, academic feel ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: radial-gradient(
        circle,
        rgba(148, 163, 184, 0.07) 1px,
        transparent 1px
      );
      background-size: 32px 32px;
      animation: grid-fade 12s ease-in-out infinite;
    }

    /* ── Subtle radial vignette for depth ── */
    #root::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse 70% 60% at 50% 40%,
        rgba(6, 182, 212, 0.03) 0%,
        transparent 60%
      );
    }

    /* ══ Respect user motion preferences ══ */
    @media (prefers-reduced-motion: reduce) {
      body::before,
      body::after {
        animation: none !important;
      }
    }

    /* Make sure app content sits above the background layers */
    #root > * {
      position: relative;
      z-index: 1;
    }

    /* ═══════════════════════════════════════════
       GLASS COMPONENTS — Obsidian Lab System
       ═══════════════════════════════════════════ */

    /* Base glass panel — used on cards, sections */
    .glass-panel {
      background: rgba(18, 24, 36, 0.60);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.07);
      box-shadow:
        inset 0 1px 0 0 rgba(226, 232, 240, 0.04),
        0 4px 24px rgba(0, 0, 0, 0.40),
        0 1px 2px rgba(0, 0, 0, 0.20);
      transition: border-color 0.3s var(--ease-out-expo),
                  box-shadow   0.3s var(--ease-out-expo),
                  transform    0.3s var(--ease-out-expo);
    }

    .glass-panel:hover {
      border-color: rgba(6, 182, 212, 0.20);
      box-shadow:
        inset 0 1px 0 0 rgba(226, 232, 240, 0.06),
        0 8px 32px rgba(0, 0, 0, 0.50),
        0 0 0 1px rgba(6, 182, 212, 0.08);
    }

    /* Navbar glass — floating, obsidian */
    .glass-nav {
      background: rgba(7, 10, 15, 0.60);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(226, 232, 240, 0.06);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.30);
    }

    .glass-nav--scrolled {
      background: rgba(7, 10, 15, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-color: rgba(226, 232, 240, 0.08);
      box-shadow: 0 4px 32px rgba(0, 0, 0, 0.40);
    }

    /* ── Utility helpers ── */
    .text-glow {
      text-shadow: 0 0 20px rgba(6, 182, 212, 0.40);
    }

    .text-gold-glow {
      text-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
    }

    .hover-lift {
      transition: transform 0.3s var(--ease-out-expo),
                  box-shadow 0.3s var(--ease-out-expo);
    }

    .hover-lift:hover {
      transform: translateY(-4px);
    }

    .preserve-3d {
      transform-style: preserve-3d;
    }

    /* ── Buttons — Obsidian Lab CTA system ── */

    /* Primary: Lab Cyan — precision instrument button */
    .btn-primary {
      background: linear-gradient(135deg, #06B6D4 0%, #0891B2 100%);
      color: #070A0F;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      height: 50px;
      padding: 0 28px;
      border-radius: var(--radius-lg);
      border: none;
      cursor: pointer;
      letter-spacing: 0.01em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      transition: transform      0.25s var(--ease-out-expo),
                  box-shadow     0.25s var(--ease-out-expo);
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #22D3EE 0%, #06B6D4 100%);
      opacity: 0;
      transition: opacity 0.25s var(--ease-out-expo);
    }
    .btn-primary:hover::before { opacity: 1; }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(6, 182, 212, 0.30),
                  0 0 0 1px rgba(6, 182, 212, 0.20);
      color: #070A0F;
    }
    .btn-primary:active {
      transform: translateY(0);
      box-shadow: none;
    }
    .btn-primary > * { position: relative; z-index: 1; }

    /* Secondary: Ghost Tactical */
    .btn-secondary {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid rgba(226, 232, 240, 0.12);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 500;
      height: 50px;
      padding: 0 28px;
      border-radius: var(--radius-lg);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.25s var(--ease-out-expo),
                  background  0.25s var(--ease-out-expo),
                  box-shadow  0.25s var(--ease-out-expo),
                  transform   0.25s var(--ease-out-expo);
    }
    .btn-secondary:hover {
      border-color: rgba(6, 182, 212, 0.30);
      background: rgba(6, 182, 212, 0.06);
      box-shadow: 0 0 0 1px rgba(6, 182, 212, 0.10);
      transform: translateY(-2px);
    }

    /* Ghost: transparent with subtle border */
    .btn-ghost {
      background: transparent;
      color: #E2E8F0;
      border: 1px solid rgba(226, 232, 240, 0.10);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 500;
      height: 50px;
      padding: 0 28px;
      border-radius: var(--radius-lg);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.25s var(--ease-out-expo),
                  background  0.25s var(--ease-out-expo);
    }
    .btn-ghost:hover {
      border-color: rgba(226, 232, 240, 0.20);
      background: rgba(226, 232, 240, 0.04);
    }

    /* ── Hero pill badge ── */
    .hero-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(6, 182, 212, 0.25);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.50), 0 0 12px rgba(6, 182, 212, 0.10);
      color: #22D3EE;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      padding: 7px 16px 7px 12px;
      border-radius: var(--radius-full);
      margin-bottom: 28px;
    }

    /* ── Section overline label ── */
    .overline {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #06B6D4;
      display: block;
      margin-bottom: 12px;
    }

    /* ── Subject cards ── */
    .subject-card {
      background: rgba(18, 24, 36, 0.60);
      border: 1px solid rgba(226, 232, 240, 0.06);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.3s var(--ease-out-expo),
                  transform    0.3s var(--ease-out-expo),
                  box-shadow   0.3s var(--ease-out-expo);
      text-decoration: none;
      display: block;
    }
    .subject-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.30);
    }
    /* Subject top accent bars */
    .subject-card[data-subject="physics"]   { border-top: 2px solid #5BA3D4; }
    .subject-card[data-subject="chemistry"] { border-top: 2px solid #F5A623; }
    .subject-card[data-subject="biology"]   { border-top: 2px solid #5BB887; }
    .subject-card[data-subject="math"]      { border-top: 2px solid #A78BFA; }
    .subject-card[data-subject="cs"]        { border-top: 2px solid #60C4D4; }

    /* ── Stat cards (inline divider-separated) ── */
    .stat-item {
      padding: 0 40px;
      border-right: 1px solid rgba(226, 232, 240, 0.08);
      text-align: center;
    }
    .stat-item:last-child { border-right: none; }
    .stat-number {
      font-family: var(--font-display);
      font-size: 40px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.1;
    }
    .stat-label {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ── Scrollbar — Lab Cyan themed ── */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(7, 10, 15, 0.9);
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #06B6D4 0%, #0891B2 50%, #164E63 100%);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #22D3EE, #06B6D4);
    }

    /* ══════════════════════════════════════════════════
         E-Prayog Navbar Orbital Logo Animations
         ══════════════════════════════════════════════════ */

    /* Outer ring — clockwise 6s */
    @keyframes ep-outer-rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Inner ring — counter-clockwise 4s */
    @keyframes ep-inner-rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }

    /* E glow pulse */
    @keyframes ep-glow-pulse {
      0%, 100% { opacity: 0.40; }
      50%       { opacity: 0.75; }
    }

    /* E letter breathe */
    @keyframes ep-e-breathe {
      0%, 100% { transform: scale(1.0); }
      50%       { transform: scale(1.03); }
    }

    /* Spark shimmer */
    @keyframes ep-spark {
      0%, 100% { opacity: 0.10; }
      50%       { opacity: 0.50; }
    }

    .ep-outer-ring {
      animation: ep-outer-rotate 8s linear infinite;
      will-change: transform;
      transform-origin: 40px 40px;
    }

    .ep-inner-ring {
      animation: ep-inner-rotate 5s linear infinite;
      will-change: transform;
      transform-origin: 40px 40px;
    }

    .ep-eglow {
      animation: ep-glow-pulse 5s ease-in-out infinite;
      will-change: opacity;
    }

    .ep-eletter {
      animation: ep-e-breathe 5s ease-in-out infinite;
      transform-origin: 40px 40px;
    }

    .ep-spark {
      animation: ep-spark ease-in-out infinite;
    }

    .ep-s1 { animation-duration: 3.5s; animation-delay: 0s; }
    .ep-s2 { animation-duration: 4.8s; animation-delay: 0.8s; }
    .ep-s3 { animation-duration: 3.2s; animation-delay: 1.6s; }
    .ep-s4 { animation-duration: 4.2s; animation-delay: 0.4s; }

    /* Hover: accelerate rings */
    .ep-logo-link:hover .ep-outer-ring { animation-duration: 2.5s; }
    .ep-logo-link:hover .ep-inner-ring { animation-duration: 1.5s; }
    .ep-logo-link:hover .ep-eglow      { opacity: 1 !important; }

    /* ═══════════════════════════════════════════
       GLOBAL TYPOGRAPHY OVERRIDES — Obsidian Lab
       ═══════════════════════════════════════════ */

    /* Force Sora for all display/heading elements */
    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-display) !important;
      color: var(--text-primary);
    }

    /* Body text — Plus Jakarta Sans */
    p, span, li, a, button, input, textarea, label {
      font-family: var(--font-body);
    }

    /* Code elements */
    code, pre, kbd, samp {
      font-family: var(--font-mono) !important;
    }

    /* Link defaults */
    a {
      color: var(--accent-primary);
      transition: color 0.2s var(--ease-out-expo);
    }
    a:hover { color: #E2E8F0; }

    /* Tailwind text color overrides to match Obsidian palette */
    .text-white    { color: var(--text-primary)   !important; }
    .text-zinc-400 { color: var(--text-secondary) !important; }
    .text-zinc-500 { color: var(--text-muted)     !important; }

    /* Emerald accent → Lab Cyan */
    .text-emerald-400,
    .text-emerald-300 {
      color: var(--accent-primary) !important;
    }
    .text-emerald-600 { color: var(--accent-muted) !important; }

    /* Bg emerald → Lab Cyan */
    .bg-emerald-600,
    .bg-emerald-500 {
      background: linear-gradient(135deg, #06B6D4, #0891B2) !important;
      color: #070A0F !important;
    }
    .hover\:bg-emerald-500:hover,
    .hover\:bg-emerald-600:hover {
      background: linear-gradient(135deg, #22D3EE, #06B6D4) !important;
    }

    /* Shadow emerald → cyan glow */
    .shadow-emerald-600\/25 {
      box-shadow: 0 8px 32px rgba(6, 182, 212, 0.20) !important;
    }
    .hover\:shadow-emerald-500\/30:hover {
      box-shadow: 0 8px 32px rgba(6, 182, 212, 0.25) !important;
    }

    /* Card backgrounds */
    .bg-zinc-900, .bg-zinc-800 {
      background-color: var(--bg-card) !important;
    }

    /* Purple accent → Lab Cyan */
    .text-purple-400 { color: var(--accent-primary) !important; }
    .from-violet-600  { --tw-gradient-from: #06B6D4 !important; }
    .to-sky-500       { --tw-gradient-to:   #0891B2 !important; }
    .bg-gradient-to-r.from-violet-600.to-sky-500 {
      background: linear-gradient(90deg, #06B6D4, #0891B2) !important;
    }

    /* Active nav underline: Lab Cyan */
    .bg-emerald-400 {
      background-color: #06B6D4 !important;
    }

    /* Hero gradient overlay: disable, handled by body layers */
    .from-emerald-500\/\[0\.07\],
    .to-blue-500\/\[0\.07\] {
      opacity: 0 !important;
    }

    /* ── Responsive typography scale ── */
    @media (max-width: 640px) {
      h1 { font-size: clamp(28px, 8vw, 46px) !important; }
      h2 { font-size: clamp(22px, 6vw, 34px) !important; }
      .stat-number { font-size: 28px !important; }
      .stat-item   { padding: 0 16px !important; }
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
