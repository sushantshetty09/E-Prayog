<!DOCTYPE html>
<!-- E-Prayoga Animated Logo — Transparent Version -->
<!-- EMBED: Copy the <div class="eprayoga-logo-wrapper"> block into your page -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Prayoga Logo — Transparent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Demo checkerboard so user can see transparency */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        repeating-conic-gradient(#ccc 0% 25%, #e8e8e8 0% 50%)
        0 0 / 24px 24px;
      font-family: 'Space Grotesk', sans-serif;
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════ -->
<!-- EMBED START: Copy everything below into your webpage   -->
<!-- ═══════════════════════════════════════════════════════ -->
<div class="eprayoga-logo-wrapper">
  <svg
    class="eprayoga-svg"
    viewBox="0 0 200 200"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    role="img"
    aria-label="E-Prayoga Logo"
  >
    <defs>
      <!-- Outer ring gradient: blue → green -->
      <linearGradient id="tr-outerRingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"   stop-color="#1A73E8" stop-opacity="0.92"/>
        <stop offset="100%" stop-color="#00C896" stop-opacity="0.92"/>
      </linearGradient>

      <!-- Inner ring gradient: green → orange -->
      <linearGradient id="tr-innerRingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"   stop-color="#00C896" stop-opacity="0.92"/>
        <stop offset="100%" stop-color="#FF8C00" stop-opacity="0.92"/>
      </linearGradient>

      <!-- E letter gradient -->
      <linearGradient id="tr-eGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="#60AAFF"/>
        <stop offset="50%"  stop-color="#1A73E8"/>
        <stop offset="100%" stop-color="#0D47A1"/>
      </linearGradient>

      <!-- E ambient glow -->
      <radialGradient id="tr-eGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#1A73E8" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#1A73E8" stop-opacity="0"/>
      </radialGradient>

      <!-- Outer electron glow -->
      <filter id="tr-outerElecGlow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <!-- Inner electron glow -->
      <filter id="tr-innerElecGlow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <!-- Ring glow -->
      <filter id="tr-ringGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.2" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <!-- E letter glow -->
      <filter id="tr-eLetterGlow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <!-- Motion paths -->
      <path id="tr-outerPath" d="M 168,100 A 68,28 0 1 1 167.99,99.97" fill="none"/>
      <path id="tr-innerPath" d="M 144,100 A 44,18 0 1 1 143.99,99.97" fill="none"/>
    </defs>

    <!-- NO background fill — fully transparent -->

    <!-- ── OUTER RING ── -->
    <g transform="translate(100,100) rotate(-20) translate(-100,-100)"
       style="will-change:transform">
      <ellipse
        cx="100" cy="100" rx="68" ry="28"
        fill="none"
        stroke="url(#tr-outerRingGrad)"
        stroke-width="1.6"
        stroke-opacity="0.82"
        filter="url(#tr-ringGlow)"
        class="eprayoga-outer-ring"
      />
    </g>

    <!-- ── INNER RING ── -->
    <g transform="translate(100,100) rotate(55) translate(-100,-100)"
       style="will-change:transform">
      <ellipse
        cx="100" cy="100" rx="44" ry="18"
        fill="none"
        stroke="url(#tr-innerRingGrad)"
        stroke-width="1.6"
        stroke-opacity="0.82"
        filter="url(#tr-ringGlow)"
        class="eprayoga-inner-ring"
      />
    </g>

    <!-- ── OUTER ELECTRONS ── -->
    <g transform="translate(100,100) rotate(-20) translate(-100,-100)" style="will-change:transform" class="eprayoga-outer-ring">
      <g filter="url(#tr-outerElecGlow)">
        <circle r="4.5" fill="#1A73E8">
          <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" calcMode="linear">
            <mpath xlink:href="#tr-outerPath"/>
          </animateMotion>
        </circle>
        <circle r="3.2" fill="#1A73E8" opacity="0.45">
          <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" calcMode="linear" begin="-0.18s">
            <mpath xlink:href="#tr-outerPath"/>
          </animateMotion>
        </circle>
        <circle r="2" fill="#1A73E8" opacity="0.22">
          <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" calcMode="linear" begin="-0.34s">
            <mpath xlink:href="#tr-outerPath"/>
          </animateMotion>
        </circle>
      </g>
      <g filter="url(#tr-outerElecGlow)">
        <circle r="4.5" fill="#00C896">
          <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" calcMode="linear" begin="-3s">
            <mpath xlink:href="#tr-outerPath"/>
          </animateMotion>
        </circle>
        <circle r="3.2" fill="#00C896" opacity="0.45">
          <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" calcMode="linear" begin="-3.18s">
            <mpath xlink:href="#tr-outerPath"/>
          </animateMotion>
        </circle>
        <circle r="2" fill="#00C896" opacity="0.22">
          <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" calcMode="linear" begin="-3.34s">
            <mpath xlink:href="#tr-outerPath"/>
          </animateMotion>
        </circle>
      </g>
    </g>

    <!-- ── INNER ELECTRON ── -->
    <g transform="translate(100,100) rotate(55) translate(-100,-100)" style="will-change:transform" class="eprayoga-inner-ring">
      <g filter="url(#tr-innerElecGlow)">
        <circle r="4" fill="#FF8C00">
          <animateMotion dur="4s" repeatCount="indefinite" rotate="auto" calcMode="linear">
            <mpath xlink:href="#tr-innerPath"/>
          </animateMotion>
        </circle>
        <circle r="2.8" fill="#FF8C00" opacity="0.45">
          <animateMotion dur="4s" repeatCount="indefinite" rotate="auto" calcMode="linear" begin="-0.15s">
            <mpath xlink:href="#tr-innerPath"/>
          </animateMotion>
        </circle>
        <circle r="1.6" fill="#FF8C00" opacity="0.22">
          <animateMotion dur="4s" repeatCount="indefinite" rotate="auto" calcMode="linear" begin="-0.28s">
            <mpath xlink:href="#tr-innerPath"/>
          </animateMotion>
        </circle>
      </g>
    </g>

    <!-- ── E AMBIENT GLOW ── -->
    <ellipse cx="100" cy="100" rx="22" ry="22"
      fill="url(#tr-eGlow)"
      class="eprayoga-eglow"
      style="will-change:opacity"/>

    <!-- ── CENTRAL E ── -->
    <g class="eprayoga-eletter" style="will-change:transform;transform-origin:100px 100px">
      <text
        x="100" y="109"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="'Space Grotesk', sans-serif"
        font-weight="700"
        font-size="38"
        fill="url(#tr-eGrad)"
        filter="url(#tr-eLetterGlow)"
        style="user-select:none;letter-spacing:-1px"
      >E</text>
    </g>

    <!-- ── SPARKS ── -->
    <circle cx="148" cy="62"  r="2"   fill="#1A73E8" class="spark spark1"/>
    <circle cx="52"  cy="72"  r="1.5" fill="#00C896" class="spark spark2"/>
    <circle cx="158" cy="138" r="1.8" fill="#FF8C00" class="spark spark3"/>
    <circle cx="44"  cy="130" r="2"   fill="#1A73E8" class="spark spark4"/>
    <circle cx="100" cy="45"  r="1.5" fill="#00C896" class="spark spark5"/>
    <circle cx="100" cy="158" r="1.8" fill="#FF8C00" class="spark spark6"/>
  </svg>

  <p class="eprayoga-wordmark">E-Prayoga</p>
</div>
<!-- ═══════════════════════════════════════════════════ -->
<!-- EMBED END                                          -->
<!-- ═══════════════════════════════════════════════════ -->

<style>
  .eprayoga-logo-wrapper {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    /* No background — transparent for overlay use */
  }

  .eprayoga-svg {
    width: 200px;
    height: 200px;
    overflow: visible;
    display: block;
  }

  /* Outer ring clockwise 6s */
  .eprayoga-outer-ring {
    transform-origin: 100px 100px;
    animation: eprayoga-outer-rotate 6s linear infinite;
    will-change: transform;
  }
  @keyframes eprayoga-outer-rotate {
    from { transform: rotate(0deg);   }
    to   { transform: rotate(360deg); }
  }

  /* Inner ring counter-clockwise 4s */
  .eprayoga-inner-ring {
    transform-origin: 100px 100px;
    animation: eprayoga-inner-rotate 4s linear infinite;
    will-change: transform;
  }
  @keyframes eprayoga-inner-rotate {
    from { transform: rotate(0deg);    }
    to   { transform: rotate(-360deg); }
  }

  /* E glow pulse */
  @keyframes eprayoga-glow-pulse {
    0%,100% { opacity: 0.45; }
    50%      { opacity: 0.85; }
  }
  .eprayoga-eglow {
    animation: eprayoga-glow-pulse 4s ease-in-out infinite;
    will-change: opacity;
  }

  /* E breathe */
  @keyframes eprayoga-e-breathe {
    0%,100% { transform: scale(1.0);  }
    50%      { transform: scale(1.03); }
  }
  .eprayoga-eletter {
    animation: eprayoga-e-breathe 4s ease-in-out infinite;
    transform-origin: 100px 100px;
  }

  /* Sparks */
  @keyframes eprayoga-spark {
    0%,100% { opacity: 0.2; }
    50%      { opacity: 0.7; }
  }
  .spark { animation: eprayoga-spark ease-in-out infinite; }
  .spark1 { animation-duration: 3.1s; animation-delay: 0s;    }
  .spark2 { animation-duration: 4.3s; animation-delay: 0.7s;  }
  .spark3 { animation-duration: 2.8s; animation-delay: 1.4s;  }
  .spark4 { animation-duration: 3.7s; animation-delay: 0.3s;  }
  .spark5 { animation-duration: 5.1s; animation-delay: 1.9s;  }
  .spark6 { animation-duration: 3.4s; animation-delay: 0.9s;  }

  /* Wordmark — inherits color for overlay use */
  .eprayoga-wordmark {
    margin: 0;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.35rem;
    letter-spacing: 0.08em;
    color: inherit;
    /* Fallback color visible on both dark/light */
    color: #1A3A8F;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* Hover */
  .eprayoga-logo-wrapper:hover .eprayoga-outer-ring {
    animation-duration: 1.8s;
  }
  .eprayoga-logo-wrapper:hover .eprayoga-inner-ring {
    animation-duration: 1.2s;
  }
  .eprayoga-logo-wrapper:hover .eprayoga-eglow {
    animation: eprayoga-glow-hover-tr 0.3s ease-out forwards,
               eprayoga-glow-pulse 4s ease-in-out infinite 0.3s;
  }
  @keyframes eprayoga-glow-hover-tr {
    0%  { opacity: 0.45; }
    100%{ opacity: 1.0;  }
  }
</style>

</body>
</html>
